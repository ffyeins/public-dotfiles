[mgr]
show_hidden = true
linemode = "mtime"

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/{json,x-wine-extension-ini,x-yaml,toml,xml}", use = "edit" },
  { name = "*.{md,markdown,toml,yaml,yml,json,conf,sh,zsh,bash,lua,vim,nix,py,rs,go,ts,tsx,js,jsx}", mime = "text/*", use = "edit" },
]
