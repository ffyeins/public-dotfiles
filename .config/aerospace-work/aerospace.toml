# AeroSpace window manager configuration
# Docs: https://nikitabobko.github.io/AeroSpace/guide

start-at-login = false

# Flatten nested containers and normalize opposite-orientation nesting
# to keep the window tree simple and predictable.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Run startup script to open apps on their designated workspaces.
# The script handles all window placement — no on-window-detected rules needed.
after-startup-command = [
    'exec-and-forget ~/.config/aerospace/startup.sh'
]

# Center the mouse on the focused monitor when switching between monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

exec-on-workspace-change = [
    '/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 5
outer.right = 5
outer.bottom = 5
outer.top = [{ monitor.secondary = 35 }, 35 ]

# ──────────────────────────────────────────────
# Workspace-to-monitor assignments
# ──────────────────────────────────────────────
# Letter workspaces are mnemonic (T=Terminal, C=Chat, etc.).
# 0-5 are general-purpose; 0-5 on main, 6-9 on secondary.
[workspace-to-monitor-force-assignment]
T = 'main'
I = 'main'
C = 'main'
B = 'main'
D = 'main'
W = 'main'           # Work
S = 'secondary'
P = 'secondary'
Y = 'secondary'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'main'
0 = 'main'
1 = 'secondary'
2 = 'secondary'
3 = 'secondary'
4 = 'secondary'
5 = 'secondary'


# ──────────────────────────────────────────────
# Main keybindings
# ──────────────────────────────────────────────
# All bindings use alt as the modifier. alt-shift variants
# perform the "move" counterpart of each navigation action.
[mode.main.binding]

# Focus windows (vim-style)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Workspace switching (mnemonic letters)
alt-t = 'workspace T'
alt-i = 'workspace I'
alt-c = 'workspace C'
alt-b = 'workspace B'
alt-d = 'workspace D'
alt-w = 'workspace W'          # Work
alt-s = 'workspace S'
alt-p = 'workspace P'
alt-f = 'fullscreen'
alt-y = 'workspace Y'
alt-1 = 'workspace 1'          # secondary monitor
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'          # main monitor
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 0'

# Move window to workspace (also trigger sketchybar update)
alt-shift-t = ['move-node-to-workspace T', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-i = ['move-node-to-workspace I', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-c = ['move-node-to-workspace C', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-b = ['move-node-to-workspace B', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-d = ['move-node-to-workspace D', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-w = ['move-node-to-workspace W', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-s = ['move-node-to-workspace S', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-p = ['move-node-to-workspace P', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-y = ['move-node-to-workspace Y', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-6 = ['move-node-to-workspace 6', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-7 = ['move-node-to-workspace 7', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-8 = ['move-node-to-workspace 8', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-9 = ['move-node-to-workspace 9', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']
alt-shift-0 = ['move-node-to-workspace 0', 'exec-and-forget sketchybar --trigger aerospace_workspace_change']

# Layout controls — toggle between tiling and accordion
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Resize the focused window
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Switch to the previously focused workspace
alt-tab = 'workspace-back-and-forth'

# Cycle focus between monitors
alt-backtick = 'focus-monitor --wrap-around next'

# Enter service mode for less common operations
alt-shift-semicolon = 'mode service'

# ──────────────────────────────────────────────
# Service mode (for less common operations)
# ──────────────────────────────────────────────
# Press alt-shift-; to enter, esc to reload config and exit.
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']        # Reset workspace tree
f = ['layout floating tiling', 'mode main']         # Toggle floating
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
