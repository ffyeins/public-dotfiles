# General settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g escape-time 10
set -g mouse on
set -g base-index 0
set -g pane-base-index 0
set -g status-interval 5
set-window-option -g mode-keys vi

# Prefix
unbind C-b
set-option -g prefix C-z
bind-key C-z send-prefix

# Keybindings
unbind r
bind r source-file ~/.tmux.conf \; display "Sourced ~/.tmux.conf"
bind '"' split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind-key x kill-pane
bind-key y run-shell "~/dotfiles/scripts/tmux_copy_last_output.sh"

# Seamless navigation between vim splits and tmux panes with C-h/j/k/l
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'if -F "#{pane_at_left}" "" "select-pane -L"'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'if -F "#{pane_at_bottom}" "" "select-pane -D"'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'if -F "#{pane_at_top}" "" "select-pane -U"'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'if -F "#{pane_at_right}" "" "select-pane -R"'

# Clipboard
set -s set-clipboard on
set -g allow-passthrough on
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Appearance
set-option -g status-position top
set -g status-right-length 100
set -g status-left ""
# Bar cursor in copy mode; back to the normal cursor on exit
set-hook -g pane-mode-changed "if -F '#{==:#{pane_mode},copy-mode}' 'set -p cursor-style bar' 'set -pu cursor-style'"

# Catppuccin
set -g @catppuccin_flavor "frappe"
# Use rounded separators between status bar segments
set -g @catppuccin_window_status_style "rounded"
# Show custom window name if manually set, otherwise show the current directory name
set -g @catppuccin_window_text " #{?#{==:#{window_name},#{pane_current_command}},#{b:pane_current_path},#W}"
set -g @catppuccin_window_current_text " #{?#{==:#{window_name},#{pane_current_command}},#{b:pane_current_path},#W}"
# FIX for misaligned pixels between round edges and fill background:
#   In iTerm2, enable "Use built-in Powerline glyphs"
#   Go to: Preferences → Profiles → Text → check "Use built-in Powerline glyphs"
# set -g @catppuccin_status_background "#191a1c"
# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Plugin necessary to change scroll skip from 5 lines to n
set -g @scroll-speed-num-lines-per-scroll "2"

run '~/.tmux/plugins/tpm/tpm'

# Must go after catppuccin loads so the @catppuccin_status_* variables are defined
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"

# Must go after plugins load to override tmux-better-mouse-mode defaults
bind-key -T copy-mode-vi DoubleClick1Pane send-keys -X select-word \; send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi TripleClick1Pane send-keys -X select-line \; send-keys -X copy-selection-no-clear
