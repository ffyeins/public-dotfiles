# General settings
set -g default-terminal "tmux-256color"
set -g mouse on
set -g status-interval 5
set -g mode-keys vi
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
# Emacs keys in the command prompt (prefix + :), even though copy mode uses vi keys
set -g status-keys emacs

# Prefix
unbind C-b
set -g prefix C-z
bind C-z send-prefix

# Keybindings
bind r source-file ~/.tmux.conf \; display "Sourced ~/.tmux.conf"
# Splits and new windows open in the current pane's directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Switch windows without letting go of Ctrl
bind C-p previous-window
bind C-n next-window
bind x kill-pane
bind y run-shell "~/dotfiles/scripts/tmux_copy_last_output.sh"
# Ask the tmux helper agent in a popup (~/dev/helper-agent)
bind -N "Ask the tmux helper" a display-popup -E -w 80% -h 80% "ask tmux"

# Seamless navigation between vim splits and tmux panes with C-h/j/k/l
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'if -F "#{pane_at_left}" "" "select-pane -L"'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'if -F "#{pane_at_bottom}" "" "select-pane -D"'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'if -F "#{pane_at_top}" "" "select-pane -U"'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'if -F "#{pane_at_right}" "" "select-pane -R"'

# Clipboard
set -s set-clipboard on
set -g allow-passthrough on
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
# In copy mode, double/triple click copies a word/line and keeps the selection (tmux's default leaves copy mode)
bind -T copy-mode-vi DoubleClick1Pane send-keys -X select-word \; send-keys -X copy-selection-no-clear
bind -T copy-mode-vi TripleClick1Pane send-keys -X select-line \; send-keys -X copy-selection-no-clear

# Mouse wheel scrolls 2 lines at a time in copy mode (tmux's default is 5)
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# Appearance
set -g status-position top
set -g status-right-length 100
# Session block, cap and divider are 9 columns + the name, so this fits names up to 25 characters;
# status-left itself is set after plugins load
set -g status-left-length 34
# Bar cursor in copy mode; back to the normal cursor on exit
set-hook -g pane-mode-changed "if -F '#{==:#{pane_mode},copy-mode}' 'set -p cursor-style bar' 'set -pu cursor-style'"

# Catppuccin
set -g @catppuccin_flavor "frappe"
# Use rounded separators between status bar segments
set -g @catppuccin_window_status_style "rounded"
# Show custom window name if manually set, otherwise show the current directory name
# (renaming a window turns its automatic-rename off)
set -g @catppuccin_window_text " #{?automatic-rename,#{b:pane_current_path},#W}"
# Yellow zoom icon after the tab label while the window is zoomed
set -ag @catppuccin_window_text "#{?window_zoomed_flag,#[fg=#{@thm_yellow}]#{@catppuccin_window_flags_icon_zoom},}"
# Same label for the current tab; -F with a plain #{@option} copies the text without expanding it
set -gF @catppuccin_window_current_text "#{@catppuccin_window_text}"
# Fill the whole session block with its colour (green, red while prefix is pressed) so it doesn't look like a tab
set -g @catppuccin_status_session_text_bg "#{E:@catppuccin_session_color}"
set -g @catppuccin_status_session_text_fg "#{@thm_crust}"
# Match the bar to the iTerm2 profile background (sets status-style, @_ctp_status_bg and the tab cap corners)
# FIX for misaligned pixels between round edges and fill background:
#   In iTerm2, enable "Use built-in Powerline glyphs"
#   Go to: Preferences → Profiles → Text → check "Use built-in Powerline glyphs"
set -g @catppuccin_status_background "#191a1c"
# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

run '~/.tmux/plugins/tpm/tpm'

# Must go after catppuccin loads so the @catppuccin_status_* variables are defined
# Session name on the left: Catppuccin blocks end square, so add a rounded cap in the session colour,
# then a dim divider to separate it from the window list
set -g status-left "#{E:@catppuccin_status_session}#[fg=#{E:@catppuccin_session_color},bg=default]#[fg=#{@thm_overlay_0}] • "
# Yellow Catppuccin-style COPY block, shown first in status-right while the current pane is in copy mode
set -gF @copy_mode_block "#[fg=#{@thm_yellow}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_yellow}]󰆏 #{@catppuccin_status_middle_separator}#[fg=#{@thm_fg},bg=#{@thm_surface_0}] COPY#[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
set -g status-right "#{?#{==:#{pane_mode},copy-mode},#{E:@copy_mode_block},}#{E:@catppuccin_status_date_time}"
